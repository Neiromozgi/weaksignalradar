# Stage A local stack: PostgreSQL + minimal FastAPI backend (A-04).
# Local loopback binds only — not a public deployment.
# Secrets come from environment variables (.env is git-ignored).

services:
  db:
    image: "postgres:${POSTGRES_VERSION:-16}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required and must not be empty (set it in .env, not in this file)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required and must not be empty (set it in .env, not in this file)}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required and must not be empty (set it in .env, not in this file)}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required and must not be empty (set it in .env, not in this file)}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      # Loopback only — local Stage A stand, not published to the internet.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: {}
