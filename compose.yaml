# Stage A local stack: PostgreSQL + minimal FastAPI backend (A-04).
# Local loopback binds only — not a public deployment.
# Secrets come from environment variables (.env is git-ignored).

services:
  db:
    image: "postgres:${POSTGRES_VERSION:-16}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required and must not be empty (set it in .env, not in this file)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required and must not be empty (set it in .env, not in this file)}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required and must not be empty (set it in .env, not in this file)}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # In-network host is always `db`; host-side tools use loopback in .env DATABASE_URL.
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      FRONTEND_DIR: "/app/frontend"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_MODEL: "${LLM_MODEL:-gpt-5.6-terra}"
      SOURCE_API_KEY: "${SOURCE_API_KEY:-}"
      SOURCE_BASE_URL: "${SOURCE_BASE_URL:-}"
      OPENALEX_MAILTO: "${OPENALEX_MAILTO:-}"
      CORDIS_SPARQL_ENDPOINT: "${CORDIS_SPARQL_ENDPOINT:-}"
      EPO_SPARQL_ENDPOINT: "${EPO_SPARQL_ENDPOINT:-}"
      EPO_LIVE_DISABLED: "${EPO_LIVE_DISABLED:-}"
      # Competition Docker path always uses frozen HF E5 (ignore host test overrides in .env).
      WSR_EMBEDDING_BACKEND: "auto"
      DISCOVERY_V2_ENABLED: "${DISCOVERY_V2_ENABLED:-true}"
      WSR_ALLOW_LLM_PROVIDER: "${WSR_ALLOW_LLM_PROVIDER:-0}"
      SNAPSHOT_DIR: "/app/snapshots"
      WSR_EVENT_LOG_PATH: "/app/logs/snnit-radar.jsonl"
    volumes:
      - snapshot_data:/app/snapshots
      - logs_data:/app/logs
    ports:
      # Loopback only — local Stage A stand, not published to the internet.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: {}
  snapshot_data: {}
  logs_data: {}
