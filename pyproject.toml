[project]
name = "weaksignalradar"
version = "0.1.0"
description = "WeakSignalRadar Stage A scaffold. No search/verification/ranking product functionality yet; see contracts/stage_a_contract.json for authorized scope."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "jinja2==3.1.6",
  "uvicorn[standard]==0.35.0",
  "sentence-transformers==3.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"weaksignalradar.fasttrack" = ["fixtures/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
